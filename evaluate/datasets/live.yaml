# คำถามข้อมูลสดจากระบบจอง — ห้ามเขียนเฉลยตายตัว
# harness เรียก Booking API ตรง (GET /rooms?checkIn=&checkOut=, /rooms, /restaurants, /payment/info)
# ทั้งก่อนและหลังถามบอท ถ้าผลสองครั้งไม่ตรงกัน (มีคนจองระหว่างทาง) ข้อนั้นถูกตัดเป็น indeterminate
# snapshot ทั้งสองครั้งถูกบันทึกลง raw
#
# live.checks ที่ใช้ได้ (คำนวณจาก snapshot ตอนรัน):
#   availability_answer       ไม่มีห้องว่าง -> ต้องบอกว่าไม่ว่าง/เต็ม, มีห้องว่าง -> ต้องเอ่ยชื่อห้องว่างอย่างน้อย 1 ห้อง
#   available_names_all       ต้องเอ่ยชื่อห้องว่างครบทุกห้อง
#   available_count           จำนวนห้องว่าง
#   cheapest_price            ราคาต่อคืนที่ถูกที่สุดในห้องว่าง
#   total_price: {rooms: N}   ราคาต่อคืนที่ถูกที่สุด x จำนวนคืน x N (กติกาเดียวกับ quote_price ที่ไม่ระบุห้อง)
#   rooms_of_type: {type: twin|single}   ชื่อห้องว่างของชนิดนั้นทุกห้อง (หรือบอกว่าไม่มี)
#   type_price: {type: ...}   ราคาต่อคืนของห้องชนิดนั้น
#   rooms_with_amenity: {amenity: ...}   ชื่อห้องว่างที่มีของชิ้นนั้นทุกห้อง
#   max_capacity              จำนวนผู้เข้าพักสูงสุดต่อห้องในแอป
#   guests_plan: {guests: N}  จำนวนห้องที่ต้องใช้ คิดจาก capacity สด + กติกาเตียงเสริมในคลัง (ห้องละไม่เกิน 1, คืนละ <อัตราจาก booking_policy.md>)
#   grand_total: {guests: N}  ค่าห้อง + ค่าเตียงเสริม ของแบบที่ใช้ห้องน้อยที่สุด
#   restaurant_names_min: {n: N}   เอ่ยชื่อร้านจาก /restaurants อย่างน้อย N ร้าน
#   restaurant_match: {pattern: regex}   เอ่ยชื่อร้านที่ชื่อ/ประเภท/คำอธิบายตรง pattern อย่างน้อย 1 ร้าน
#   promptpay_id / hold_minutes   ค่าจาก /payment/info
#   extra_bed_total: {beds: N, nights: M}   อัตราเตียงเสริมจากคลัง x N x M (ไม่ต้องใช้ dates)
# ทุกข้อในไฟล์นี้ตรวจ no_fake_rooms อัตโนมัติ: ชื่อห้องรูปแบบ [A-Z]\d ในคำตอบต้องมีอยู่ใน GET /rooms

- id: lv-01
  language: th
  category: availability
  question: "คืนนี้มีห้องว่างไหมคะ"
  answerable: true
  expected_tools: [search_available_rooms]
  allowed_extra_tools: [quote_price]
  expected_args: {check_in: today, check_out: today+1}
  live:
    dates: {check_in: today, check_out: today+1}
    checks: [availability_answer]
  source_ref: ["booking_api:GET /rooms?checkIn&checkOut"]
  consistency_subset: true

