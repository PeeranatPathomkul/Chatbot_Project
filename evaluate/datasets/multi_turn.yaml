- id: mt-10
  language: th
  category: extra_bed
  # มา 3 คน 2 คืน -> เตียงเสริม 1 เตียง x 2 คืน x 200 = 400 (อัตราจากคลัง, จำนวนคืนจากข้อความแรก)
  turns: ["มา 3 คน พัก 2 คืน", "ค่าเตียงเสริมรวมทั้งหมดเท่าไหร่"]
  answerable: true
  expected_tools: [quote_price]
  allowed_extra_tools: [search_knowledge_base, search_available_rooms]
  expected_args: {guests: 3}
  # ยอดคำนวณตอนรัน = อัตราเตียงเสริมที่อ่านจาก th/booking_policy.md x 1 เตียง x 2 คืน (ไม่เขียนตัวเลขตายตัว)
  live:
    checks: [{extra_bed_total: {beds: 1, nights: 2}}]
  reference_answer: "ห้องเดียวพร้อมเตียงเสริม 1 เตียง ค่าเตียงเสริมคืนละ 200 บาท x 2 คืน = 400 บาท ชำระที่รีสอร์ทวันเช็คอิน"
  source_ref: ["th/rates.md#ค่าใช้จ่ายเพิ่มเติม"]

