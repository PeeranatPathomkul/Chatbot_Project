- id: mt-01
  language: th
  category: guests_plan
  turns: ["มากัน 4 คนค่ะ", "ห้องเดียวพอไหม"]
  answerable: true
  expected_tools: [quote_price]
  allowed_extra_tools: [search_available_rooms, search_knowledge_base]
  expected_args: {guests: 4}
  live:
    dates: {check_in: today, check_out: today+1}
    checks: [{guests_plan: {guests: 4}}]
  source_ref: ["booking_api:GET /rooms (capacity)", "th/booking_policy.md#การจองและการชำระเงิน"]

