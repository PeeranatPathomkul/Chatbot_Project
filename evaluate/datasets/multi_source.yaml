- id: ms-01
  language: th
  category: guests_plan
  question: "มา 3 คน เสาร์อาทิตย์หน้า ห้องเดียวขอเตียงเสริม รวมทั้งหมดต้องจ่ายเท่าไหร่"
  answerable: true
  expected_tools: [quote_price]
  allowed_extra_tools: [search_knowledge_base, search_available_rooms]
  expected_args: {check_in: next_weekend, check_out: next_weekend+2, guests: 3}
  key_facts:
    - any: ["ที่รีสอร์ท"]
  live:
    dates: {check_in: next_weekend, check_out: next_weekend+2}
    checks: [{grand_total: {guests: 3}}]
  source_ref: ["booking_api:GET /rooms?checkIn&checkOut", "th/rates.md#ค่าใช้จ่ายเพิ่มเติม", "th/booking_policy.md#การจองและการชำระเงิน"]
  consistency_subset: true

