# คำถามที่ระบบไม่มีคำตอบ — ควรได้ answered=false (ประโยคปฏิเสธ + เบอร์โทร)
# กลุ่มแรก: หัวข้อที่ในคลังยังเป็น <<รอเติม: ...>> / <<TODO: ...>> (validator ยืนยันว่าบรรทัดใน source_ref มี << จริง)
#   ตอน index บรรทัดเหล่านี้ถูกแทนด้วย "ยังไม่ได้รับข้อมูลจากรีสอร์ท ไม่มีข้อมูลเรื่องนี้ในระบบ" (chunking.mask_placeholder_lines)
#   2026-10-18: เจ้าของรีสอร์ทเติมข้อมูลให้หลายหัวข้อ ข้อเหล่านั้นย้ายไปอยู่ kb_filled.yaml แล้ว
#   หัวข้อที่เจ้าของตอบว่า "ไม่ทราบ" ยังคงเป็น placeholder และถูกเพิ่มคำถามทั้งไทย/อังกฤษไว้ที่นี่
# กลุ่มสอง: เรื่องที่ไม่มีในคลังเลย (validator ยืนยันว่าคำใน absent_terms ไม่ปรากฏใน data/ ทั้ง 14 ไฟล์)
#   ไม่ใช้คำถามเรื่องของในห้อง (เช่น ไมโครเวฟ) เพราะบอทอ่านรายการของในห้องจากระบบจองแล้วตอบได้ว่า "ไม่มีห้องไหนระบุไว้"
#   ซึ่งเป็นคำตอบที่สมเหตุสมผล ทำให้ป้ายเฉลยกำกวม
# forbidden = รูปแบบของตัวเลข/ลิงก์ที่ถ้าโผล่มาแปลว่าแต่งขึ้น (ใช้ตรวจ hallucination แยกจาก answered)

