services:
  chatbot-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Booking API รันอยู่นอก compose stack นี้ (อยู่ใน stack ของ backend)
    # จึงต้องเปิดทางให้ container คุยกลับออกไปหาโฮสต์ได้
    # ทางเลือกอื่นคือต่อสองสแตกเข้า network เดียวกันแล้วเรียกด้วยชื่อ service แทน
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ตั้งทับค่าใน .env เฉพาะตอนรันใน container
      # .env เก็บเป็น localhost ไว้สำหรับตอนรัน uvicorn บนเครื่องตรง ๆ
      # ส่วนใน container คำว่า localhost หมายถึงตัว container เอง จึงต้องชี้ออกไปที่โฮสต์
      BOOKING_API_BASE_URL: http://host.docker.internal:3000/api
    volumes:
      # persist ข้อมูล ChromaDB ไว้นอก container กันข้อมูลหายตอน rebuild
      - ./data:/app/data
      # ฐานความรู้จริงที่ indexing-pipeline สร้างไว้ (ดู DEFAULT_CHROMA_PATH ใน app/config.py)
      # mount แบบ read-only เพราะ API เป็นแค่ผู้อ่าน ไม่ได้เป็นคนเขียน collection นี้
      - ../indexing-pipeline/chroma_db:/indexing-pipeline/chroma_db:ro
